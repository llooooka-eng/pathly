name: pathly
description: Your personal goal companion — powered by AI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  http: ^1.1.0
  flutter_animate: ^4.3.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  intl: '>=0.18.0 <0.20.0'
  uuid: ^4.2.1
  google_mobile_ads: ^4.0.0
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  share_plus: ^7.2.2
  flutter_tts: ^3.8.5
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.2.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
